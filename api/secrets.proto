syntax = "proto3";

package gophkeeper;

option go_package = "./gophkeeper";

message SecretInfo {
    enum Kind {
        UNDEFINED = 0;
        CREDENTIALS = 1;
        CARD = 2;
        TEXT = 3;
        RAW = 4;
    }

    repeated bytes uuid = 1;
    string name = 2;
    Kind kind = 3;
}

message Credentials {
    string login = 1;
    string password = 2;
}

message Card {
    string number = 1;
    string holder = 2;
    string expires = 3;
    string verification_code = 4;
}

message Text {
    string content = 1;
}

message Raw {
    bytes content = 1;
}

message Secret {
    string name = 1;
    string description = 2;
    oneof secret {
        Credentials credentials = 3;
        Card card = 4;
        Text text = 5;
        Raw raw = 6;
    }
}

message ListRequest {}

message ListResponse {
    repeated SecretInfo secrets_info = 1;
}

message CreateRequest {
    Secret secret = 1;
}

message CreateResponse {
    repeated bytes uuid = 1;
}

message ReadRequest {
    repeated bytes uuid = 1;
}

message ReadResponse {
    Secret secret = 1;
}

message UpdateRequest {
    repeated bytes uuid = 1;
    Secret secret = 2;
}

message UpdateResponse {}

message DeleteRequest {
    repeated bytes uuid = 1;
}

message DeleteResponse {}

service Secrets {
    rpc List(ListRequest) returns (ListResponse);
    rpc Create(CreateRequest) returns (CreateResponse);
    rpc Read(ReadRequest) returns (ReadResponse);
    rpc Update(UpdateRequest) returns (UpdateResponse);
    rpc Delete(DeleteRequest) returns (DeleteResponse);
}
